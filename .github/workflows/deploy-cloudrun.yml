# Production deployment pipeline for the Express + SPA container.
#   CI (type-check, tests, bundle scans, pgTAP/RLS suites) must be green for the exact commit.
#   -> staging deploys automatically
#   -> production deploys only after staging succeeds AND a reviewer approves the "production" environment.
# Only the main branch can trigger it; manual runs re-use the same gates and only accept main.
name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Only the main branch may deploy
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "Manual deployments must run from main." && exit 1
      - name: Require a green CI run for this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OK=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
          [ "$OK" -ge 1 ] || { echo "No successful CI run for ${{ github.sha }}."; exit 1; }
      - name: CI must have succeeded (automatic runs)
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: echo "CI did not succeed; not deploying." && exit 1
      - id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

  staging:
    needs: gate
    uses: ./.github/workflows/_cloudrun-deploy.yml
    with:
      environment: staging
      ref: ${{ needs.gate.outputs.sha }}

  production:
    needs: [gate, staging]
    uses: ./.github/workflows/_cloudrun-deploy.yml
    with:
      environment: production   # configure required reviewers on this GitHub environment
      ref: ${{ needs.gate.outputs.sha }}
