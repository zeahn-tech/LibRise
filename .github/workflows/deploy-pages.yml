name: Deploy to GitHub Pages

# Note on the deployment race this repo hit once (Sept 26, 2026): this
# workflow's very first run happened while the repo's Pages source was
# still "legacy" (Settings -> Pages -> Source -> Deploy from a branch).
# GitHub's own automatic legacy build fired at the same time as this
# workflow, uploading a competing, unbuilt github-pages artifact from
# the raw repo root (the same root index.html that causes the white
# screen this workflow exists to fix -- see its <script src="/src/main.tsx">,
# which no browser can execute unbundled). Whichever of the two
# deployments landed last determined what was actually live, so the
# fix did not visibly take effect until BOTH (a) Pages source was
# switched to "GitHub Actions" in Settings, permanently disabling the
# legacy auto-build, AND (b) this workflow ran again afterward to
# produce a deployment with no competing legacy race. If Pages source
# is ever accidentally switched back to "Deploy from a branch", this
# same race can recur.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a new push cancels an in-flight one
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Scoped to the same "github-pages" environment as the deploy job
    # below. This matters: if SUPABASE_PAGES_URL / SUPABASE_PAGES_ANON_KEY
    # were added as Environment secrets on "github-pages" (which GitHub
    # auto-creates/suggests the first time a repo deploys to Pages, and
    # is an easy thing to pick without realizing the distinction) rather
    # than as plain repository-level Actions secrets, a job with no
    # `environment:` declared cannot see them at all -- they'd silently
    # evaluate to empty strings, which is indistinguishable from "no
    # secrets configured" and is exactly what caused a build to
    # correctly-but-unhelpfully fall back to demo mode after secrets had
    # genuinely been added. Declaring the same environment here means
    # this job sees the secret regardless of which of the two places
    # (repository-level or this environment) they were added.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine build mode (real Supabase project vs. demo)
        id: mode
        env:
          SUPABASE_PAGES_URL: ${{ secrets.SUPABASE_PAGES_URL }}
          SUPABASE_PAGES_ANON_KEY: ${{ secrets.SUPABASE_PAGES_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_PAGES_URL" ] && [ -n "$SUPABASE_PAGES_ANON_KEY" ]; then
            echo "supabase_url=$SUPABASE_PAGES_URL" >> "$GITHUB_OUTPUT"
            echo "supabase_anon_key=$SUPABASE_PAGES_ANON_KEY" >> "$GITHUB_OUTPUT"
            echo "demo_mode=false" >> "$GITHUB_OUTPUT"
          else
            # Deliberately EMPTY, not a fake placeholder string. Every
            # src/services/*.ts service guards its Supabase client with a
            # `client()` helper that throws a clear, friendly AppError
            # ("Supabase is not configured; <service> requires a live
            # backend.") when getSupabaseClient() returns null -- which it
            # only does for a genuinely empty URL/key (see
            # src/lib/supabaseClient.ts and src/config/env.ts). A
            # non-empty but fake value like "https://placeholder.supabase.co"
            # defeats that guard entirely: getSupabaseClient() happily
            # constructs a real SupabaseClient pointed at a domain that
            # doesn't correspond to any real project, so every data call
            # attempts (and fails) a real network request instead of
            # failing fast with a clear message -- surfacing as a
            # confusing generic "unexpected system error" the moment a
            # visitor does anything beyond the landing page. Leaving these
            # empty routes through the already-well-designed guard instead.
            echo "supabase_url=" >> "$GITHUB_OUTPUT"
            echo "supabase_anon_key=" >> "$GITHUB_OUTPUT"
            echo "demo_mode=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report build mode (safe -- no secret values printed)
        # If this run isn't correctly picking up SUPABASE_PAGES_URL /
        # SUPABASE_PAGES_ANON_KEY (wrong secret name, extra whitespace,
        # wrong environment scoping if this workflow is ever restricted
        # to a specific GitHub Environment, etc.), this is where that
        # would show up -- check this step's log in the Actions tab.
        # Never echoes the anon key itself, only whether one was
        # detected and the configured host name.
        #
        # TEMPORARY, ONE-RUN DIAGNOSTIC (remove after this confirms one
        # way or the other): exits with an error if no real secrets were
        # detected, specifically so run CONCLUSION (success/failure) is
        # checkable via the GitHub API without needing to read this
        # step's actual log text, which isn't reachable from the
        # environment doing this debugging. A failure here means the
        # secrets genuinely are not visible to this job; a success means
        # they are, and the remaining "Supabase is not configured"
        # symptom (if it persists) is coming from somewhere other than
        # this workflow -- the Supabase project itself, or the browser
        # caching an old deployment.
        run: |
          if [ "${{ steps.mode.outputs.demo_mode }}" = "true" ]; then
            echo "::error::No real Supabase secrets detected (or one of the two is missing) -- building in demo mode with an empty Supabase URL/key."
            exit 1
          else
            echo "Real Supabase secrets detected. Building against host: $(echo "${{ steps.mode.outputs.supabase_url }}" | sed -E 's#https?://##; s#/.*##')"
          fi

      - name: Build static site for GitHub Pages
        # GitHub Pages serves static files only -- it cannot run server.ts
        # (no Node process, no Stripe webhooks, no Gemini proxy). This is a
        # client-only build of the same app.
        #
        # IMPORTANT, and different from what this comment used to claim:
        # VITE_ENABLE_DEMO_MODE does NOT make the whole app work standalone
        # without a real Supabase project. As of Phase 3's migration, every
        # data service in src/services/*.ts (opportunities, businesses,
        # candidates, etc.) always talks to real Supabase -- demo mode only
        # affects a narrow slice of authService.ts (which default user
        # authService shows on load / falls back to). Without real
        # Supabase credentials, this build correctly leaves
        # VITE_SUPABASE_URL/ANON_KEY empty (see the step above) so every
        # service's client() guard fails fast with a clear "Supabase is
        # not configured" message instead of attempting real network calls
        # against nothing. The app is genuinely browsable (landing page,
        # navigation, UI) but data-backed screens will show that message
        # until a real project is configured.
        #
        # Building with real Supabase credentials here is fully supported
        # and is what actually makes this deployment functional end to
        # end -- set the SUPABASE_PAGES_URL / SUPABASE_PAGES_ANON_KEY
        # repository secrets (Settings -> Secrets and variables -> Actions)
        # to a real project's URL and anon key; both are safe to expose
        # client-side by design (see docs/DEPLOYMENT.md Section 2).
        #
        # This is a DIFFERENT, intentional use of demo mode from the leak
        # fixed in the "seed-PII-in-client-bundle" work: that fix was about
        # demo/seed data silently shipping in a build meant to be a real,
        # data-handling production deployment regardless of configuration.
        # This workflow explicitly builds a public, clearly-labeled demo
        # site -- shipping the same synthetic seed data here is correct and
        # intended, not a regression of that fix.
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ steps.mode.outputs.supabase_url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.mode.outputs.supabase_anon_key }}
          VITE_ENABLE_DEMO_MODE: ${{ steps.mode.outputs.demo_mode }}
          VITE_APP_ENV: production

      - name: Remove server bundle from the Pages artifact
        # dist/server.cjs (+ .map) is the Node server bundle -- GitHub Pages
        # can't run it, and it should never be served as a static file
        # regardless (see the check:no-service-key-leak / no-seed-pii-in-
        # bundle scripts, which deliberately exclude it as a DIFFERENT
        # exposure surface with its own rules -- it has no business being
        # in a static-hosting artifact at all).
        run: rm -f dist/server.cjs dist/server.cjs.map

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
